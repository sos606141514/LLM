# Copy to config.yaml. ${VAR} values are read from environment variables.

llm:
  base_url: ${LLM_BASE_URL}        # e.g. http://llm.internal:8000/v1  (POST {base_url}/chat/completions)
  model: ${LLM_MODEL}
  api_key: ${LLM_API_KEY}          # sent as "Authorization: Bearer ..."; leave empty if not needed
  headers: {}                      # extra headers, e.g. {X-Tenant: abc}
  tool_mode: native                # native = API supports OpenAI `tools`; prompt = it doesn't
  temperature: 0
  timeout: 120
  verify_ssl: true                 # or a path to your internal CA bundle

mongodb:
  user: ${MONGO_USER}              # use a read-only account; remove user/password if no login
  password: ${MONGO_PW}
  ip: ${MONGO_IP}
  port: 27017
  database: mydb
  auth_source: admin               # database the account is created in (usually admin)
  # options: {directConnection: true}   # extra pymongo options, e.g. tls, replicaSet
  #
  # Other ways to connect (use instead of the lines above):
  #   uri: ${MONGO_URI}                         # a connection string
  #   factory: mymongo:Mongo                    # your own connection class/function
  #   connect_method: connectmongo
  allowed_collections: [orders, customers]   # remove to allow every collection
  # Or describe each collection so the model knows which one to query (only these can be queried):
  # collections:
  #   orders: One document per order - order_no, amount, status, created
  #   customers: Customer profiles, linked to orders by customer_id
  max_limit: 50
  max_time_ms: 10000
  # notes: |                       # field meanings / business rules, read by the model on demand
  #   orders.amount is in TWD; revenue only counts status = "paid"
  # notes_file: notes/mydb.md      # or keep them in a file (path relative to this config file)

# Several databases with different purposes: make `mongodb` a list, give each a name and description.
# mongodb:
#   - name: sales
#     description: Sales system - orders, customers, payments
#     user: ${SALES_MONGO_USER}
#     password: ${SALES_MONGO_PW}
#     ip: ${SALES_MONGO_IP}
