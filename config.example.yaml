# Skills: Markdown files with step-by-step procedures (report formulas, API workflows...).
# Only their names and descriptions go into the system prompt; the model calls load_skill when needed.
# skills_dir: skills               # path relative to this config file

# Collection descriptions are listed in the system prompt while there are at most this many in total;
# with more, the model reads them with mongo_source_info instead.
# max_prompt_collections: 30

max_steps: 8
max_result_chars: 8000
